# DRAFT - freeze (git tag) BEFORE running any evaluation on the eval split.
seed: 1234
task:
  dataset: glue/sst2            # [TO VERIFY] access + license on the official source
  demo_pool_split: train        # few-shot demos come from train only
  eval_split: validation        # 872 examples
  eval_subset_size: 500         # fixed subset chosen by seed; ids saved to results/eval_ids.json
  labels: {negative: 0, positive: 1}
models:                         # [TO VERIFY] availability on Hugging Face
  - Qwen/Qwen2.5-1.5B-Instruct
  - Qwen/Qwen2.5-3B-Instruct
shots: [0, 1, 3, 5]
formats:
  n_formats: 30                 # same 30 formats for every model and k (paired design)
  factors:
    field_sep: [": ", " - ", ":\n", " = ", ":: "]
    name_case: [original, upper, title]
    item_sep: ["\n", "\n\n", " ", " || "]
    space_around_sep: [0, 1]
scoring: "next-token logit comparison between the two label tokens; raw text prompt, no chat template (deliberate deviation, log it)"
primary_metric: "accuracy per format; spread = max - min over the 30 formats (higher = more sensitive)"
secondary: "std, IQR, majority-label rate (label collapse), canonical-format accuracy"
deeper_analysis: "(1) factor-level effects of format features on accuracy; (2) label-collapse / failure cases"
uncertainty: "bootstrap over eval examples (paired across formats), 1000 resamples"
